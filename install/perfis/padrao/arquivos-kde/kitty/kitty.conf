# Fundo sólido, a mesma cor da área de arquivos do Nautilus (2026-11-22)
background_opacity 1.0
foreground #ffffff
background #141618

# Fonte Nerd Font (ajuste conforme o nome exato da sua)
font_family MesloLGS Nerd Font
font_size 13.0

tab_bar_style powerline

# Cursor e espaçamento
cursor_shape block
cursor_blink_interval 0.6
cursor_trail 100

cursor_trail_decay 0.1 0.4
cursor_trail_start_treshold 2

# Tipo de cursor (block, beam ou underline)
cursor_shape block

# Espessura do cursor (funciona se usar beam ou underline)
cursor_beam_thickness 2.0
cursor_underline_thickness 3.0

# Cor do cursor
cursor_text_color black
cursor_color #FF66C4

# Suavizar o texto
text_antialias true

hide_window_decorations no
tab_bar_style powerline
tab_bar_min_tabs 1
tab_powerline_style round

shell /usr/bin/zsh

copy_on_select yes
mouse_map right click paste_from_clipboard
mouse_map middle release ungrabbed paste_from_clipboard
