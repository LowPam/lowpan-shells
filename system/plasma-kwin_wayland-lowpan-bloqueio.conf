# LowPan Shells (§22.11): tela de bloqueio no visual da tela de login do LowPan. No Plasma 6 o kscreenlocker_greet
# pega a pasta lockscreen/ do pacote de shell de PLASMA_DEFAULT_SHELL, herdado do ambiente do KWin — só o KWin recebe
# a variável (o plasmashell é outro serviço e continua no pacote dele). Pacote: system/plasma-shell/org.lowpan.shells,
# ligado em ~/.local/share/plasma/shells/. Vale no próximo login, nas sessões LowPan e Plasma.
[Service]
Environment=PLASMA_DEFAULT_SHELL=org.lowpan.shells
