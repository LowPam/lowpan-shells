# LowPan Shells (§21.72): com o marcador de sessão "iris" o plasmashell não sobe sozinho —
# quem sobe é o lowpan-shells.service. Ligado em ~/.config/systemd/user/plasma-plasmashell.service.d/
# pelo ensure_installed do system/lowpan-shells-switch. Sem marcador (login antigo) não muda nada.
# (caminho via link ~/.config/quickshell/lowpan-shells -> <projeto>/shell, sem amarrar a pasta do projeto)
[Service]
ExecCondition="%h/.config/quickshell/lowpan-shells/../system/lowpan-sessao-e" plasma
