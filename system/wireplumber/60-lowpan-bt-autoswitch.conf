# LowPan: saída Bluetooth vira a padrão ao conectar (script em
# ~/.local/share/wireplumber/scripts/lowpan-bt-autoswitch.lua, link para
# system/wireplumber/ no projeto).
wireplumber.components = [
  {
    name = lowpan-bt-autoswitch.lua, type = script/lua
    provides = custom.lowpan-bt-autoswitch
  }
]
wireplumber.profiles = {
  main = { custom.lowpan-bt-autoswitch = required }
}
